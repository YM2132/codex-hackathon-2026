<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 280px; margin: 12px; color: #111; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .status { padding: 8px; border-radius: 6px; margin-bottom: 10px; }
  .ok { background: #e6f4ea; color: #137333; } .no { background: #fce8e6; color: #a50e0e; }
  ul { margin: 4px 0 0; padding-left: 18px; color: #444; }
  @media (prefers-color-scheme: dark) { body { background: #202124; color: #eee; } ul { color: #bbb; }
    .ok { background: #0d3a1e; color: #81c995; } .no { background: #4a1512; color: #f28b82; } }
</style>
<h1>Look-ahead preview</h1>
<div id="status" class="status">Checking this tab…</div>

<ul id="sites"></ul>
